services:

  # The Context Broker (Orion-LD)
  orion-ld:
    image: quay.io/fiware/orion-ld:1.7.1 # fiware/orion-ld:1.7.1
    hostname: orion
    container_name: orion-ld
    depends_on:
      - mongo
    environment:
      - OAUTH2_ENABLED=true
      - OAUTH2_TOKEN_ENDPOINT=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      - OAUTH2_CLIENT_ID=${ORION_CLIENT_ID}
      - OAUTH2_CLIENT_SECRET=${ORION_CLIENT_SECRET}
    command: -dbhost mongo-db -db orionld -logLevel DEBUG -forwarding -mongocOnly # avoids Legacy C++ driver (deprecated) but disable NGSI-v2 support
    healthcheck:
      test: curl -sf http://localhost:1026/version

  # DB for the Context Broker (MongoDB)
  mongo:
    image: mongo #:5.0.30 #:6.0.19 #:8.0.4
    hostname: mongo-db
    container_name: db-mongo
  # networks:
  #   - mongoadmin-net
  # command: --nojournal # for mongo < 6.0
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-configdb:/data/configdb
      - mongo-db:/data/db
    healthcheck:
    # test: test $$(echo "db.runCommand('ping').ok" | mongosh --quiet) -eq 1
    # test: mongosh --eval "db.runCommand('ping')"
      test: mongosh localhost:27017/test --quiet

  # Identity Manager (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak #:23.0.6 #:26.0.7
    hostname: idm
    container_name: keycloak
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
    # - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME}
    # - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HEALTH_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./configs/realm-config.json:/opt/keycloak/data/import/realm-config.json
      - keycloak-data:/opt/keycloak/data/
    healthcheck:
    # test: "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;"
      test: "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"

  # Reverse proxy and web server (Nginx)
  nginx:
    image: nginx #:1.27.3
    hostname: context
    container_name: nginx
    depends_on:
      - keycloak
      - orion-ld
      - node-red
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./public:/home/www/public_html/localhost/public
    entrypoint: ["/bin/sh", "-c", "/docker-entrypoint.sh nginx & while true; do sleep 60d; nginx -s reload; done"]
    healthcheck:
    # test: curl -sf --head http://context/data-models/context.jsonld | awk 'NR==1{print $2}' | grep -q -e "200"
    # test: curl -sf --head http://context/data-models/context.jsonld | awk '/^HTTP/{print $2}' | grep -q -e "200"
    # test: curl -sf http://localhost/data-models/context.jsonld -o /dev/null -w %{http_code} | grep -q -e "200"
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /etc/letsencrypt/live -type d -empty -exec false {} +"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest # ghcr.io/linuxserver/duckdns
    container_name: duckdns
    network_mode: host
    environment:
      - SUBDOMAINS=engsep
      - TOKEN=c2b414eb-7d11-44c7-ad23-0547a2de4bb0 # https://www.duckdns.org/domains (engsep@github)
      - UPDATE_IP=both
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nslookup engsep.duckdns.org || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Context Provider, Custom IoT Agent, Demo webapp and Swagger (Node-RED)
  node-red:
  # build: node-red
    image: nodered/node-red #:4.0.8
    hostname: ${HOSTNAME:-node-red}
    container_name: node-red
    depends_on:
      - ganache
      - keycloak
      - mosquitto
      - orion-ld
    ports:
      - "${PORT:-1880}:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Amsterdam
    # user: root
    # entrypoint: bash -c "cd /data; npm i --unsafe-perm --no-update-notifier --no-fund --only=production; cd /usr/src/node-red; ./entrypoint.sh"
    entrypoint: ["/bin/bash", "-c", "cd /data; chown -R 1000:1000 .; npm install --unsafe-perm --no-update-notifier --no-fund --only=production; cd /usr/src/node-red; ./entrypoint.sh"]
    restart: unless-stopped
    volumes:
      - ./node-red/data:/data
    # - .:/home/node-red

  # Blockchain with deployed PoE smart contract (Ganache)
  ganache:
  # image: trufflesuite/ganache #:v7.9.2
    image: hybuild/ganache:poe9 #:etk4
    hostname: ethereum
    container_name: ganache
    ports:
      - "7545:7545"
  # command: --database.dbPath /db --server.host 0.0.0.0 --server.port 7545 --wallet.mnemonic "visit carpet logic blame furnace confirm rebel deliver medal mean illness error"
    volumes:
      - ganache-db:/db
    healthcheck:
      test: node -e "fetch('http://localhost:7545', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ id:1, jsonrpc:'2.0', method:'eth_blockNumber' }) }).then(res => res.json()).then(res => process.exit(0)).catch(err => process.exit(1));"

  # MQTT Broker (MosQuiTTo)
  mosquitto:
    image: eclipse-mosquitto #:2.0.20
    hostname: mqtt
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error

  # docker exec -it mosquitto mosquitto_sub -h mosquitto -t "/#"
  # docker exec -it mosquitto mosquitto_pub -h mosquitto -m "Hello world!" -t "/test"

  # Mongo DB front-end (Mongo Express)
  mongo-express:
    image: mongo-express #:1.0.2-18
    hostname: mongo-admin
    container_name: mongo-express
    depends_on:
      - mongo
  # networks:
  #   - mongoadmin-net
  # ports:
  #   - "8081:8081"
    environment:
    # - ME_CONFIG_BASICAUTH=true
    # - ME_CONFIG_BASICAUTH_USERNAME=admin
    # - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_MONGODB_SERVER=mongo-db
      - ME_CONFIG_SITE_BASEURL=/mongoadmin
      - ME_CONFIG_HEALTH_CHECK_PATH=/status
    healthcheck:
      test: wget --quiet --tries=3 --spider http://admin:pass@127.0.0.1:8081/mongoadmin/status

  # docker run -it --rm --net=dedalus-net --name mongo-express -e ME_CONFIG_BASICAUTH=false -e ME_CONFIG_MONGODB_SERVER=mongo-db mongo-express
  # docker run -it --rm --net=dedalus-net --name ngrok -e NGROK_AUTHTOKEN=<authtoken> ngrok/ngrok:latest http 8081

  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data # admin|123
    command: ["-H", "unix:///var/run/docker.sock"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=3 --spider http://127.0.0.1:9000/api/system/status || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  blockchain-db: ~
  ganache-db: ~
  keycloak-data: ~
  mongo-configdb: ~
  mongo-db: ~
  mosquitto-data: ~
  mosquitto-log: ~
  portainer-data: ~

