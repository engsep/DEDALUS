version: "3.8"

services:

  # The Context Broker (Orion-LD)
  orion:
    image: fiware/orion-ld:1.5.1
    expose:
      - "1026"
    depends_on:
      - mongo   
    command: -db orionld -logLevel DEBUG -forwarding -dbhost mongo   
    healthcheck:
      test: curl -sf http://localhost:1026/version
    environment:
      - OAUTH2_ENABLED=true
      - OAUTH2_TOKEN_ENDPOINT=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      - OAUTH2_CLIENT_ID=${ORION_CLIENT_ID}
      - OAUTH2_CLIENT_SECRET=${ORION_CLIENT_SECRET}
    networks:
      - dedalus-net
    
  # DB for the Context Broker (MongoDB)
  mongo:
    image: mongo:4.4
    command: --nojournal
    volumes:
      - mongo-db:/data/db
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: mongo --eval "db.adminCommand('ping')" --quiet
    networks:
      - dedalus-net

  # The Context Provider, PoC and Swagger GUI (Node.js)
  node-red:
    image: nodered/node-red:3.1.9-18
    hostname: ${HOSTNAME:-node-red}
    restart: always
    ports:
      - "${CP_PORT:-1880}:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Amsterdam
    user: root
    entrypoint: bash -c "cd /data; npm i --unsafe-perm --no-update-notifier --no-fund --only=production; cd /usr/src/node-red; ./entrypoint.sh"
    volumes:
      - ./node-red/data:/data
      - .:/home/node-red
    depends_on:
      - keycloak
    networks:
      - dedalus-net

  # Keycloak (Identity Manager)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./configs/realm-config.json:/opt/keycloak/data/import/realm-config.json
      - keycloak_dedalus_data:/opt/keycloak/data/
    networks:
      - dedalus-net

  # Reverse Proxy for Orion and Node-RED
  nginx:
    image: nginx:1.25.4
    container_name: nginx
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WS_PORT:-80}:80"
    depends_on:
      - orion
      - keycloak
      - node-red
    networks:
      - dedalus-net

  # The Web Server for LD @context files (Nginx)
  context:
    image: nginx:1.25.4
    depends_on:
      - node-red
    ports:
      - "${WS_PORT:-8081}:80"
    volumes:
      - ./public:/usr/share/nginx/html
    healthcheck:
      test: curl -sf http://localhost/data-models/ngsi-context.jsonld
    networks:
      - dedalus-net

volumes:
  mongo-db: ~
  keycloak_dedalus_data:

networks:
  dedalus-net:
    name: dedalus-net
    driver: bridge