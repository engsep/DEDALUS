# See original file:
# docker run --rm nginx cat /etc/nginx/conf.d/default.conf

upstream node_red {
    server  node-red:1880;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    # server_name  engsep.duckdns.org;

    #access_log  /var/log/nginx/host.access.log  main;

    # Proxy Keycloak in HTTP (avoids HSTS activation in the browser)
    location /idm {
        proxy_pass        http://keycloak:8080/idm;
        proxy_set_header  Host  $host;
    }

    location / {
        return  301  https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  _;

    ssl_certificate      /etc/letsencrypt/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/privkey.pem;
  # ssl_certificate      /etc/letsencrypt/certificate.crt;
  # ssl_certificate_key  /etc/letsencrypt/private.key;

    # Enable CORS
    add_header 'Access-Control-Allow-Credentials' "true";
    add_header 'Access-Control-Allow-Origin'      "*";
    add_header 'Access-Control-Allow-Methods'     "GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD";
    add_header 'Access-Control-Allow-Headers'     "*";
    if ($request_method = 'OPTIONS') {
        return 204; 
    }
  # add_header 'Access-Control-Allow-Methods'     "GET, POST, PUT, DELETE, OPTIONS";
  # add_header 'Access-Control-Allow-Headers'     "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With";
  # add_header 'Access-Control-Expose-Headers'    "Authorization";
  # add_header 'X-Frame-Options'                  "DENY";
  # add_header 'X-Content-Type-Options'           "nosniff";
  # add_header 'Content-Security-Policy'          "default-src 'self'";

    # Path without authentication: /orion/version
    location /orion/version {
        proxy_pass  http://orion:1026/version;
    }

    # Path without authentication: /orion/ngsi-ld/ex/v1/version
    location /orion/ngsi-ld/ex/v1/version {
        proxy_pass  http://orion:1026/ngsi-ld/ex/v1/version;
    }

    # Proxy Orion protected with Keycloak authentication
    location /orion/ {
        proxy_pass  http://orion:1026/;

        # JWT token verification with Keycloak
        auth_request  /auth;
    }

    # Endpoint for token verification with Keycloak
    location = /auth {
        internal;
        proxy_pass        http://keycloak:8080/idm/realms/dedalus/protocol/openid-connect/userinfo;
        proxy_set_header  Authorization  $http_authorization;
    }

    # Proxy Node-RED
    location ~* /(dashboard|editor|ui|winter|worldmap) {
        proxy_pass  http://node_red;

	# If using a different location, e.g. `/red/`, we need to rewrite all of the /red/ URLS to remove the `red` part
	# rewrite  ^/red/(.*)$ /$1 break;

	# If you only want to expose the Node-RED Dashboard instead of the whole of Node-RED 
	# rewrite  ^/(.*)$ /ui/$1 break;

        # Disable buffer
        proxy_buffering  off;

	# Defines the HTTP protocol version for proxying (by default it is set to 1.0).
	# For Websockets and keepalive connections you need to use the version 1.1    
	proxy_http_version  1.1;

	# These header fields are required if your application is using Websockets
	proxy_set_header  Upgrade            $http_upgrade;
	proxy_set_header  Connection         "upgrade";

	# Sets conditions under which the response will not be taken from a cache.
	# proxy_cache_bypass $http_upgrade;

	# The $host variable in the following order of precedence contains:
	# hostname from the request line, or hostname from the Host request header field, or the server name matching a request.    
	proxy_set_header  Host               $host;

	# Forwards the real visitor remote IP address to the proxied server
	# proxy_set_header  X-Real-IP          $remote_addr;

	# A list containing the IP addresses of every server the client has been proxied through    
	# proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;

	# When used inside an HTTPS server block, each HTTP response from the proxied server is rewritten to HTTPS.    
	# proxy_set_header  X-Forwarded-Proto  $scheme;

	# Defines the original host requested by the client.    
	# proxy_set_header  X-Forwarded-Host   $host;

	# Defines the original port requested by the client.    
	# proxy_set_header  X-Forwarded-Port   $server_port;
    }

    # Proxy Portainer
    location /dockeradmin/ {
        proxy_pass        http://portainer:9000/;
        proxy_set_header  Host               $host;
	proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
    }

    # Proxy Mongo-Express
    location /mongoadmin {
        proxy_pass        http://mongo-express:8081;
        proxy_set_header  Host               $host;
	proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
    #   rewrite  ^/mongoadmin(.*)$ /$1 break;
    }

    location ^~ /smartdatamodels/ {
        proxy_pass  https://smartdatamodels.org:1026/;
    }

    ## Blockchain
    #location ^~ /ganache/ {
    #    proxy_pass          http://ganache:7545/;
    #
    #    # Enable WebSockets
    #    proxy_http_version  1.1;
    #    proxy_set_header    Upgrade            $http_upgrade;
    #    proxy_set_header    Connection         "upgrade";
    #
    #    proxy_set_header    X-Real-IP          $remote_addr;
    #    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    #    proxy_set_header    Host               $http_host;
    #    proxy_set_header    X-NginX-Proxy      true;
    #}

    # Test URL proxy
    location /example/ {
        proxy_pass  http://example.org/;
    }

    # Test API proxy
    location /ip {
        proxy_pass  http://ifconfig.me;
        rewrite  ^/ip/(.*)$ /$1 break;
    }

    # Test proxy vars (Complete list: https://nginx.org/en/docs/varindex.html)
    location /test {
        default_type text/plain;
        return 200 "
            Server IP: $server_addr\n
            Client IP: $remote_addr\n
            Hostname: $hostname\n
            Server Name: $server_name\n
            Remote Port: $remote_port\n
            Proxy Add X-Forwarded-For: $proxy_add_x_forwarded_for\n
            HTTPS: $https\n
            SSL Cipher: $ssl_cipher\n
            SSL Protocol: $ssl_protocol\n
            Nginx Version: $nginx_version\n
            Request Method: $request_method\n
            Request URI: $request_uri\n
            URI: $uri\n
            Document Root: $document_root\n
            Document URI: $document_uri\n
            Request Filename: $request_filename\n
            Request Length: $request_length\n
            Msec: $msec\n
            Request: $request\n
            Host: $host\n
            User Agent: $http_user_agent\n
            Protocol: $server_protocol\n
            Time: $time_local\n
            Date Local: $date_local\n
            Time ISO8601: $time_iso8601\n
            Accept Language: $http_accept_language\n
            Status: $status\n
            Scheme: $scheme\n
            HTTP Cookie: $http_cookie\n";
    }

    # Default web server
    location  /default {
        alias  /usr/share/nginx/html;
      # root  /usr/share/nginx/html/;
        index  index.html index.htm;
    }

    # Nginx web server
    location / {
        root   /home/www/public_html/localhost/public/;
        index  index.html index.htm;
        try_files  $uri $uri/ index.html =404;
        autoindex  on;
    }

    error_page 401 = @error401;
    location @error401 {
        return 401  '"Unauthorized"';
        add_header  Content-Type  application/json;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
