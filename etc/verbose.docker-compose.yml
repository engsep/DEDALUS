services:

  # The Context Broker (Orion-LD)
  orion-ld:
    image: quay.io/fiware/orion-ld:1.8.0 # fiware/orion-ld:1.8.0
    hostname: orion
    container_name: orion-ld
  # depends_on:
  #   mongo:
  #     condition: service_healthy
    depends_on:
      - mongo
  # restart: on-failure # for Docker Compose
  # deploy:             # for Docker Swarm
  #   restart_policy:
  #     condition: on-failure
    restart: unless-stopped
  # networks:
  #   - default
  # networks:
  #   default:
  #     aliases:
  #       - context-broker
  #       - ...
    expose:
      - "1026"      # orion-ld:1026
  # ports:
  #   - "1026:1026" # http://localhost:1026
  # environment:
  #   - OAUTH2_ENABLED=true
  #   - OAUTH2_TOKEN_ENDPOINT=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
  #   - OAUTH2_CLIENT_ID=${ORION_CLIENT_ID}
  #   - OAUTH2_CLIENT_SECRET=${ORION_CLIENT_SECRET}
    command: -dbhost mongo-db -db orionld -logLevel DEBUG -forwarding # -mongocOnly # for mongo > 5.0, avoids Legacy C++ driver (deprecated) but disables NGSI-v2 support
    healthcheck:
    # test: curl -sf http://localhost:1026/version || exit 1
      test: ["CMD-SHELL", "curl -sf http://localhost:1026/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database for the Context Broker (MongoDB)
  mongo:
    image: mongo:5.0 #:5.0.30 #:6.0.19 #:8.0.4
    hostname: mongo-db
    container_name: db-mongo
    restart: unless-stopped
  # networks:
  #   - mongo-admin-net
    expose:
      - "27017"       # mongo:27017
  # ports:
  #   - "27017:27017" # http://localhost:27017
    command: --nojournal # for mongo < 6.0
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-configdb:/data/configdb
      - mongo-db:/data/db
    healthcheck:
    # test: test $$(echo "db.runCommand('ping').ok" | mongosh --quiet) -eq 1
    # test: mongosh --eval "db.runCommand('ping') --quiet"
    # test: mongosh localhost:27017/test --quiet
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 }).ok' --quiet | grep -q 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # Identity Manager (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:latest #:23.0.6 #:26.1.0
    hostname: idm
    container_name: keycloak
    restart: unless-stopped
    expose:
      - "8080"      # keycloak:8080
      - "8443"      # keycloak:8443
      - "9000"      # keycloak:9000
    ports:
      - "8080:8080" # http://localhost:8080
    # - "8443:8443" # https://localhost:8443
      - "9000:9000" # http://localhost:9000
    environment:
    # - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USERNAME}
    # - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    # - KC_HTTPS_CERTIFICATE_FILE=/etc/x509/https/fullchain.pem
    # - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/x509/https/privkey.pem
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/idm # used for Nginx routing
      - KC_PROXY_HEADERS=xforwarded # used for X-Forwarded headers in Nginx
    # - KC_SPI_ADMIN_REALM=dedalus
    command: start-dev --import-realm
    volumes:
    # - ./certbot/conf/live/engsep.duckdns.org/:/etc/x509/https
      - ./keycloak/:/opt/keycloak/data/import/
      - keycloak-data:/opt/keycloak/data/
    healthcheck:
    # test: "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /idm/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;"
    # test: "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /idm/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /idm/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # In production...
  #
  # environment:
  #   ...
  #   - KC_HTTP_ENABLED=false
  #   - KC_HOSTNAME_STRICT_HTTPS=true
  #   - KC_DB=postgres (necessita quindi di un container postgres...)
  #   - KC_DB_URL_HOST=database
  #   - KC_DB_URL_DATABASE=keycloak
  #   - KC_DB_USERNAME=keycloak
  #   - KC_DB_PASSWORD=password
  #   - KC_HOSTNAME=your-domain.com (p.e. engsep.duckdns.org)
  #   - KC_HTTPS_CERTIFICATE_FILE=/etc/x509/https/fullchain.pem
  #   - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/x509/https/privkey.pem
  #   - KC_PROXY=edge
  # command: start --optimized
  # volumes:
  #   ...
  #   - ./certbot/conf/live/engsep.duckdns.org/:/etc/x509/https
  # depends_on:
  #   - database
  # ...
  #
  # database:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: keycloak
  #     POSTGRES_PASSWORD: password
  #   volumes:
  #     - ./postgres_data:/var/lib/postgresql/data

  # Reverse proxy and web server (Nginx)
  nginx:
    image: nginx:latest #:1.27.3
    hostname: context
    container_name: nginx
    depends_on:
      - keycloak
      - orion-ld
      - node-red
    restart: unless-stopped
    expose:
      - "80"      # nginx:80
      - "443"     # nginx:443
    ports:
      - "80:80"   # http://localhost
      - "443:443" # https://localhost
    environment:
      - HTTP_X_FORWARDED_PORT=80
    volumes:
      - ./certbot/conf/live/engsep.duckdns.org:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./public:/home/www/public_html/localhost/public
  # entrypoint: ["/bin/sh", "-c", "/docker-entrypoint.sh nginx & while true; do sleep 60d; nginx -s reload; done"]
    healthcheck:
    # test: curl -sf --head http://context/data-models/context.jsonld | awk 'NR==1{print $2}' | grep -q -e "200"
    # test: curl -sf --head http://context/data-models/context.jsonld | awk '/^HTTP/{print $2}' | grep -q -e "200"
    # test: curl -sf http://localhost/data-models/context.jsonld -o /dev/null -w %{http_code} | grep -q -e "200"
      test: ["CMD-SHELL", "curl -sf http://localhost || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SSL Certificate renewal (Certbot)
  certbot:
    image: certbot/certbot:latest #:v3.1.0
    container_name: certbot
    restart: unless-stopped
    expose:
      - "80"      # certbot:80
      - "443"     # certbot:443
  # ports:
  #   - "80:80"   # http://localhost
  #   - "443:443" # https://localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/tmp:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --deploy-hook 'docker exec nginx nginx -s reload'; sleep 12h & wait $${!}; done"]
  # entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]
    healthcheck:
      test: ["CMD-SHELL", "find /etc/letsencrypt/live -type d -empty -exec false {} +"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dynamic DNS renewal (DuckDNS) - use init.sh
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest #:version-b1648298 # ghcr.io/linuxserver/duckdns
    container_name: duckdns
    restart: unless-stopped
    network_mode: host
    environment:
      - SUBDOMAINS=engsep
      - TOKEN=c2b414eb-7d11-44c7-ad23-0547a2de4bb0 # https://www.duckdns.org/domains (engsep@github)
      - UPDATE_IP=both
    healthcheck:
      test: ["CMD-SHELL", "nslookup engsep.duckdns.org || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Context Provider, Custom IoT Agent, Demo webapp, Flow-based development and Swagger (Node-RED)
  node-red:
  # build: node-red
    image: nodered/node-red:latest #:4.0.8
    hostname: ${HOSTNAME:-node-red}
    container_name: node-red
    depends_on:
      - ganache
      - keycloak
      - mosquitto
      - orion-ld
    restart: unless-stopped
    expose:
      - "1880"               # node-red:1880
    ports:
      - "${PORT:-1880}:1880" # http://localhost:${PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FULL_DOMAIN=engsep.duckdns.org
      - NGINX_HTTP_PORT=80
      - NGINX_HTTPS_PORT=443
      - TZ=Europe/Amsterdam
    user: root
    entrypoint: bash -c "cd /data; npm i --unsafe-perm --no-update-notifier --no-fund --only=production; chown -R node-red:node-red .; cd /usr/src/node-red; su -c ./entrypoint.sh node-red"
    volumes:
      - ./node-red/data:/data
  #   - .:/home/node-red

  # Blockchain with deployed PoE smart contract (Ganache)
  ganache:
  # image: trufflesuite/ganache #:v7.9.2
    image: hybuild/ganache:poe9 #:etk4
    hostname: ethereum
    container_name: ganache
    restart: unless-stopped
    expose:
      - "7545"      # ganache:7545
      - "8545"      # ganache:8545
    ports:
      - "7545:7545" # http://localhost:7545
  # command: --database.dbPath /db --server.host 0.0.0.0 --server.port 7545 --wallet.mnemonic "visit carpet logic blame furnace confirm rebel deliver medal mean illness error"
    volumes:
      - ganache-db:/db
    healthcheck:
    # test: node -e "fetch('http://localhost:7545', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ id:1, jsonrpc:'2.0', method:'eth_blockNumber' }) }).then(res => res.json()).then(data => process.exit(0)).catch(err => process.exit(1));"
      test: ["CMD", "node", "-e", "fetch('http://localhost:7545', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ id:1, jsonrpc:'2.0', method:'eth_blockNumber' }) }).then(res => res.json()).then(data => { if (data.result) { process.exit(0); } else { process.exit(1); } }).catch(err => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MQTT Broker (MosQuiTTo)
  mosquitto:
    image: eclipse-mosquitto:latest #:2.0.20
    hostname: mqtt
    container_name: mosquitto
    restart: unless-stopped
    expose:
      - "1883"      # mosquitto:1883
      - "9001"      # mosquitto:9001
    ports:
      - "1883:1883" # http://localhost:1883
      - "9001:9001" # http://localhost:9001
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
    # test: mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error
      test: ["CMD-SHELL", "timeout 5 mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # docker exec -it mosquitto mosquitto_sub -h mosquitto -t "/#"
  # docker exec -it mosquitto mosquitto_pub -h mosquitto -m "Hello world!" -t "/test"

  # MongoDB front-end (Mongo Express)
  mongo-express:
    image: mongo-express:latest #:1.0.2-18
    hostname: mongo-admin
    container_name: mongo-express
    depends_on:
      - mongo
    restart: unless-stopped
  # networks:
  #   - mongo-admin-net
    expose:
      - "8081"      # mongo-express:8081
  # ports:
  #   - "8081:8081" # http://localhost:8081
    environment:
    # - ME_CONFIG_BASICAUTH=true
    # - ME_CONFIG_BASICAUTH_USERNAME=admin
    # - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_MONGODB_SERVER=mongo-db
      - ME_CONFIG_SITE_BASEURL=/mongoadmin
      - ME_CONFIG_HEALTH_CHECK_PATH=/status
    healthcheck:
    # test: wget --quiet --tries=3 --spider http://admin:pass@127.0.0.1:8081/mongoadmin/status
      test: ["CMD-SHELL", "wget --quiet --tries=3 --spider http://admin:pass@127.0.0.1:8081/mongoadmin/status || exit 1"]

  # docker run -it --rm --net=db --name mongo-express -e ME_CONFIG_BASICAUTH=false -e ME_CONFIG_MONGODB_SERVER=mongo-db mongo-express
  # docker run -it --rm --net=db --name ngrok -e NGROK_AUTHTOKEN=<authtoken> ngrok/ngrok:latest http 8081

  # Docker front-end (Portainer)
  portainer:
    image: portainer/portainer-ce:alpine # for healthcheck support
    hostname: docker-admin
    container_name: portainer
    restart: unless-stopped
    expose:
      - "8000"      # portainer:8000
      - "9000"      # portainer:9000
      - "9443"      # portainer:9443
  # ports:
  #   - "8000:8000" # http://localhost:8000
  #   - "9000:9000" # http://localhost:9000
  #   - "9443:9443" # https://localhost:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # - portainer-data:/data
      - ./portainer:/data # admin|123
    command: ["-H", "unix:///var/run/docker.sock"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=3 --spider http://127.0.0.1:9000/api/system/status || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  blockchain-db: ~
  ganache-db: ~
  keycloak-data: ~
  mongo-configdb: ~
  mongo-db: ~
  mosquitto-data: ~
  mosquitto-log: ~
  portainer-data: ~

# networks:
#   mongo-admin-net:
#     name: db
#     driver: bridge
