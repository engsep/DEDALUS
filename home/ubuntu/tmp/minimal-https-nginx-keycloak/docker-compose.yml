services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest #:26.1.0
    environment:
    # - KEYCLOAK_ADMIN=admin
    # - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    # - KC_HTTPS_CERTIFICATE_FILE=/etc/x509/https/fullchain1.pem
    # - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/x509/https/privkey1.pem
      - KC_HTTP_RELATIVE_PATH=/idm
    # - KC_HTTP_ENABLED=true
    # - KC_HOSTNAME_STRICT_HTTPS=false
    #volumes:
    # - "./certs/:/etc/x509/https"
    ports:
      - "8080:8080"
    # - "8443:8443"
      - "9000:9000"
    command: start-dev

  nginx:
    image: nginx:latest #:1.27.3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - keycloak
