services:

  # To set the IP of the current server into the DNS service
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest # ghcr.io/linuxserver/duckdns
    container_name: duckdns
    network_mode: host
    environment:
      - SUBDOMAINS=samothrace
      - TOKEN=c2b414eb-7d11-44c7-ad23-0547a2de4bb0 # https://www.duckdns.org/domains (engsep@github)
      - UPDATE_IP=both
    restart: unless-stopped

  # Inspect and manage Docker images and containers
  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    command: ["-H", "unix:///var/run/docker.sock"]
    restart: unless-stopped

volumes:
  portainer-data: ~
